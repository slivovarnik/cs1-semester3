name: CS3 CI/CD Pipeline

on:
  push:
    branches:
      - cs2
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  # ── Job 1: Terraform Plan (runs on every push and PR) ──
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

  # ── Job 2: Terraform Apply (manual dispatch — action=apply) ──
  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # ── Job 3: Terraform Destroy (manual dispatch — action=destroy) ──
  terraform-destroy:
    name: Terraform Destroy
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false

  # ── Job 4: Build and push Docker images ──
  docker-build:
    name: Build and Push Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/cs2'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: app/backend
        run: |
          docker build -t 536300832697.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-backend:latest .
          docker push 536300832697.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-backend:latest

      - name: Build and push frontend image
        working-directory: app/frontend
        run: |
          docker build -t 536300832697.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-frontend:latest .
          docker push 536300832697.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-frontend:latest

  # ── Job 5: Deploy to k3s via SSM ──
  # Uses AWS SSM to run kubectl on the k3s instance directly
  # This avoids needing VPN access from the GitHub Actions runner
  # The runner uploads manifests to S3, then SSM pulls them on the instance
  k8s-deploy:
    name: Deploy to Kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/cs2'
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Upload manifests to S3
        run: |
          aws s3 cp k8s/ s3://rosi-terraform-state-536300832697-eu-central-1-an/k8s-manifests/ \
            --recursive \
            --region eu-central-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-02739fbbb473bc76a \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["aws s3 cp s3://rosi-terraform-state-536300832697-eu-central-1-an/k8s-manifests/ /tmp/k8s-manifests/ --recursive --region eu-central-1 && sudo kubectl apply -f /tmp/k8s-manifests/ && sudo kubectl rollout restart deployment/hr-backend -n hr-app && sudo kubectl rollout restart deployment/hr-frontend -n hr-app && sudo kubectl get pods -n hr-app"]' \
            --region eu-central-1 \
            --query Command.CommandId \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          sleep 45

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-02739fbbb473bc76a \
            --region eu-central-1 \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output table

  # ── Job 6: Deploy Lambda functions ──
  lambda-deploy:
    name: Deploy Lambda Functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/cs2'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300832697:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Deploy Lambda functions only
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_lambda_function.onboarding \
            -target=aws_lambda_function.offboarding