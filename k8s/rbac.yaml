# ClusterRole for DevOps operators
# Full access to all resources in the cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
# ClusterRole for developers
# Read-only access to cluster resources for debugging
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for DevOps operators
# Maps the devops-admin role to the devops group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-admin
subjects:
  - kind: Group
    name: devops
    apiGroup: rbac.authorization.k8s.io

---
# ClusterRoleBinding for developers
# Maps the developer-viewer role to the developers group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-viewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-viewer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io

---
# Role for HR application namespace
# Allows viewing and managing HR app resources only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hr-app-operator
  namespace: hr-app
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]

---
# RoleBinding for HR app namespace
# Maps the hr-app-operator role to the hr-team group
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hr-app-operator-binding
  namespace: hr-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hr-app-operator
subjects:
  - kind: Group
    name: hr-team
    apiGroup: rbac.authorization.k8s.io