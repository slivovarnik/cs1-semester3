# Ingress resource for k3s using Traefik
# k3s comes with Traefik disabled in our setup
# We use a simple NodePort service instead
# The frontend service will be exposed on a fixed port
# accessible through the VPN to the k3s node's private IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-ingress
  namespace: hr-app
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hr-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-frontend
                port:
                  number: 80