# NodePort service for the frontend
# Exposes the frontend on a fixed port on the k3s node
# VPN-connected users access the application through
# the k3s node's private IP and this port
apiVersion: v1
kind: Service
metadata:
  name: hr-frontend
  namespace: hr-app
spec:
  selector:
    app: hr-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort