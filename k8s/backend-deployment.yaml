# Backend deployment - Node.js API
# 2 replicas spread across both AZs for resilience
# Satisfies design-for-failure requirement
# Uses the IRSA service account for Secrets Manager access
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: hr-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      serviceAccountName: hr-backend-sa
      containers:
        - name: hr-backend
          image: 985738120856.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: AWS_REGION
              value: eu-central-1
            - name: DB_SECRET_ARN
              value: arn:aws:secretsmanager:eu-central-1:985738120856:secret:case-study-hr-db
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"