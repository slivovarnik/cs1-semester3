# Backend deployment - Node.js HR API
# 2 replicas for resilience
# Uses EC2 instance profile for Secrets Manager access
# instead of IRSA since we are running on k3s
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: hr-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      containers:
        - name: hr-backend
          image: 536300832697.dkr.ecr.eu-central-1.amazonaws.com/case-study-hr-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: AWS_REGION
              value: eu-central-1
            - name: DB_SECRET_ARN
              value: arn:aws:secretsmanager:eu-central-1:536300832697:secret:case-study-hr-db-tGxCtk
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"