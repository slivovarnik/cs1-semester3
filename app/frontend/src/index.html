<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovatech HR Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
        }
        header {
            background: #1F5C8B;
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 20px; }
        header span { font-size: 13px; opacity: 0.8; }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1F5C8B; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #4a5568; }
        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-primary { background: #1F5C8B; color: white; }
        .btn-danger { background: #e53e3e; color: white; }
        .btn:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left;
            padding: 12px;
            background: #f7fafc;
            border-bottom: 2px solid #e2e8f0;
            color: #4a5568;
            font-size: 12px;
            text-transform: uppercase;
        }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-active { background: #c6f6d5; color: #276749; }
        .badge-inactive { background: #fed7d7; color: #822727; }
        .status-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat {
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #1F5C8B; }
        .stat-label { font-size: 13px; color: #718096; margin-top: 4px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #c6f6d5; color: #276749; }
        .alert-error { background: #fed7d7; color: #822727; }
    </style>
</head>
<body>
    <header>
        <h1>Innovatech HR Portal</h1>
        <span>Employee Lifecycle Management</span>
    </header>

    <div class="container">
        <div class="status-bar">
            <div class="stat">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="activeCount">-</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="inactiveCount">-</div>
                <div class="stat-label">Offboarded</div>
            </div>
        </div>

        <div class="card">
            <h2>Add New Employee</h2>
            <div id="formAlert"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="jane@innovatech.com">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="department">
                        <option value="">Select department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Sales">Sales</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="role" placeholder="Software Engineer">
                </div>
            </div>
            <br>
            <button class="btn btn-primary" onclick="addEmployee()">Onboard Employee</button>
        </div>

        <div class="card">
            <h2>Employee Directory</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="employeeTable">
                    <tr><td colspan="8" style="text-align:center;padding:24px;color:#718096">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API = '/api';
        const LIFECYCLE_API = 'https://e3fqer80g0.execute-api.eu-central-1.amazonaws.com';

        async function loadEmployees() {
            try {
                const res = await fetch(`${API}/employees`);
                const employees = await res.json();

                const total = employees.length;
                const active = employees.filter(e => e.status === 'active').length;
                const inactive = total - active;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('activeCount').textContent = active;
                document.getElementById('inactiveCount').textContent = inactive;

                const tbody = document.getElementById('employeeTable');
                if (employees.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#718096">No employees found. Add your first employee above.</td></tr>';
                    return;
                }

                tbody.innerHTML = employees.map(e => `
                    <tr>
                        <td>${e.id}</td>
                        <td><strong>${e.name}</strong></td>
                        <td>${e.email}</td>
                        <td>${e.department}</td>
                        <td>${e.role}</td>
                        <td><span class="badge badge-${e.status}">${e.status}</span></td>
                        <td>${new Date(e.created_at).toLocaleDateString()}</td>
                        <td>
                            ${e.status === 'active'
                                ? `<button class="btn btn-danger" onclick="offboard(${e.id}, '${e.email}')">Offboard</button>`
                                : '<span style="color:#718096;font-size:13px">Offboarded</span>'
                            }
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error loading employees:', err);
            }
        }

        async function addEmployee() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value;
            const role = document.getElementById('role').value.trim();
            const alertDiv = document.getElementById('formAlert');

            if (!name || !email || !department || !role) {
                alertDiv.innerHTML = '<div class="alert alert-error">All fields are required.</div>';
                return;
            }

            try {
                // Step 1 — Create employee record in database
                const res = await fetch(`${API}/employees`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, department, role })
                });

                if (res.ok) {
                    alertDiv.innerHTML = '<div class="alert alert-success">Employee onboarded successfully.</div>';
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('department').value = '';
                    document.getElementById('role').value = '';
                    loadEmployees();

                    // Step 2 — Trigger Lambda onboarding function
                    // Creates IAM Identity Center user and logs audit trail to CloudWatch
                    // Runs async so it does not block the UI
                    fetch(`${LIFECYCLE_API}/onboard`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, department, role })
                    }).then(r => {
                        if (r.ok) {
                            console.log('IAM Identity Center provisioning triggered for', email);
                        } else {
                            console.warn('IAM provisioning unavailable - SCP restriction');
                        }
                    }).catch(err => {
                        console.warn('IAM provisioning unavailable:', err);
                    });

                } else {
                    const err = await res.json();
                    alertDiv.innerHTML = `<div class="alert alert-error">${err.error}</div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = '<div class="alert alert-error">Failed to connect to server.</div>';
            }

            setTimeout(() => { alertDiv.innerHTML = ''; }, 4000);
        }

        async function offboard(id, email) {
            if (!confirm('Are you sure you want to offboard this employee?')) return;

            try {
                // Step 1 — Update employee status in database
                const res = await fetch(`${API}/employees/${id}/offboard`, {
                    method: 'PATCH'
                });

                if (res.ok) {
                    loadEmployees();

                    // Step 2 — Trigger Lambda offboarding function
                    // Disables IAM Identity Center account and logs audit trail to CloudWatch
                    fetch(`${LIFECYCLE_API}/offboard`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    }).then(r => {
                        console.log('IAM Identity Center offboarding triggered for', email);
                    }).catch(err => {
                        console.warn('IAM offboarding unavailable:', err);
                    });
                }
            } catch (err) {
                console.error('Error offboarding:', err);
            }
        }

        loadEmployees();
        setInterval(loadEmployees, 30000);
    </script>
</body>
</html>
